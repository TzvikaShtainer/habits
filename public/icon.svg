<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 3x3 habit grid: 112px cells, 28px gaps, 60px margin -->
  <g>
    <rect x="60"  y="60"  width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="200" y="60"  width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="340" y="60"  width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="60"  y="200" width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="200" y="200" width="112" height="112" rx="24" fill="#ef4444"/>
    <rect x="340" y="200" width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="60"  y="340" width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="200" y="340" width="112" height="112" rx="24" fill="#22c55e"/>
    <rect x="340" y="340" width="112" height="112" rx="24" fill="none" stroke="#475569" stroke-width="10"/>
  </g>
  <!-- check mark on the first cell -->
  <path d="M88 116 l20 20 l38 -40" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
